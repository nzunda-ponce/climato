name: Actualizar informe Climato
on:
  push:
    branches: [main]
    paths:
      [
        "src/domain/**",
        "src/providers/**",
        "src/jobs/**",
        "scripts/data-worker.ts",
        ".github/workflows/data-worker.yml",
      ]
  workflow_dispatch:
    inputs:
      mode:
        description: Proceso de datos
        type: choice
        options: [refresh, bootstrap, publish]
        default: refresh
  schedule:
    # Argentina (UTC-3): 07:17 and 19:17; refresh resumes small history batches.
    - cron: "17 10,22 * * *"
permissions:
  contents: read
concurrency:
  group: climato-data-worker
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.CLIMATO_DATABASE_URL }}
      WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
      CLIMATO_ROLE: worker
      CLIMATO_JOB_MAX_MINUTES: "30"
      # Prefer IPv4 on hosted runners; retain Node's address-family fallback.
      NODE_OPTIONS: "--dns-result-order=ipv4first --enable-network-family-autoselection"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - name: Ejecutar proceso y publicar resultados
        env:
          MANUAL_MODE: ${{ inputs.mode }}
          RUN_EVENT: ${{ github.event_name }}
        run: |
          if [ "$RUN_EVENT" = 'push' ]; then
            # Recompute from Neon after a model change; no weather API calls.
            job_mode=publish
          elif [ -n "$MANUAL_MODE" ]; then
            job_mode="$MANUAL_MODE"
          else
            job_mode=refresh
          fi
          case "$job_mode" in
            refresh|bootstrap|publish) npm run "data:$job_mode" ;;
            *) exit 1 ;;
          esac
