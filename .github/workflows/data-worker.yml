name: Actualizar informe Climato
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Proceso de datos
        type: choice
        options: [refresh, bootstrap, publish]
        default: refresh
  schedule:
    # UTC: hourly short-term refresh; historical preparation is a daily bounded pass.
    - cron: '17 * * * *'
    - cron: '43 5 * * *'
permissions:
  contents: read
concurrency:
  group: climato-data-worker
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.CLIMATO_DATABASE_URL }}
      WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
      CLIMATO_ROLE: worker
      CLIMATO_JOB_MAX_MINUTES: '30'
    steps:
      - uses: actions/checkout@v4
        with:
          # This repository's deployed application lives on this release branch.
          ref: codex/automatic-data-import
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - name: Ejecutar proceso y publicar resultados
        env:
          MANUAL_MODE: ${{ inputs.mode }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -n "$MANUAL_MODE" ]; then
            job_mode="$MANUAL_MODE"
          elif [ "$SCHEDULE" = '43 5 * * *' ]; then
            job_mode=bootstrap
          else
            job_mode=refresh
          fi
          case "$job_mode" in
            refresh|bootstrap|publish) npm run "data:$job_mode" ;;
            *) exit 1 ;;
          esac
